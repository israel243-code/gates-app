name: build-apk

on:
  push:
    branches: [main]
    paths-ignore:
      - 'byd-probe/**'
      - '.github/workflows/byd.yml'
      - '.github/workflows/byd-module.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || { grep -E "error:|e: |What went wrong|Duplicate class|Could not|FAILED|\\.java:[0-9]+" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk gates.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest gates.apk --title "שערים 1 · b1.${{ github.run_number }} · עדכון #$(( ${{ github.run_number }} - 11 ))" --notes "בנייה אוטומטית"
