name: build-byd-probe

on:
  push:
    branches: [main]
    paths:
      - 'byd-probe/**'
      - '.github/workflows/byd.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: byd-probe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk byd-probe.apk
          gh release delete byd-latest -y --cleanup-tag || true
          gh release create byd-latest byd-probe.apk --latest=false --prerelease --title "בדיקת רכב · בנייה ${{ github.run_number }}" --notes "אפליקציית בדיקה לרכב BYD (לא קשורה לאפליקציית השערים)"
