plugins {
    id 'com.android.application'
}

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'il.israel.gates'
    compileSdk 34

    defaultConfig {
        applicationId 'il.israel.gates'
        minSdk 26
        targetSdk 34
        versionCode run
        versionName "1" // עד ההשקה הרשמית: גרסה 1; כל בנייה = "עדכון N" (versionCode)
    }

    // מפתח חתימה קבוע: כל גרסה חדשה מותקנת מעל הקודמת (בלי להסיר)
    signingConfigs {
        rel {
            storeFile file('../signing/gates.p12')
            storeType 'pkcs12'
            storePassword 'gatesapp'
            keyAlias 'gates'
            keyPassword 'gatesapp'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.rel
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// אנדרואיד אוטו (18/11, באישור הבעלים): הספרייה הרשמית של גוגל לאפליקציות רכב
dependencies {
    implementation 'androidx.car.app:app:1.4.0'
    // 19/11 (הבעלים אישר): סורק הברקוד של גוגל – לחיבור מסך הרכב
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'dev.mobile:dadb:1.2.10' // 🔧 25/11 (באישור הבעלים): חיבור לניפוי הבאגים של הרכב – מצב מפתחים (DevMode.java)
}
